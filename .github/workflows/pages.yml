name: Deploy to GitHub Pages

# Builds the app with base /perflens/ and publishes dist/ to GitHub Pages on
# every push to main. Requires the repository owner to enable Pages with
# "Source: GitHub Actions" (Settings -> Pages); until then deploy is skipped
# so pushes still pass CI.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PERFLENS_BASE: /perflens/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: ${{ github.event.repository.has_pages }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
